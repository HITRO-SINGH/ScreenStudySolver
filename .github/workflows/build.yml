name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 9.6.0
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-9.6-bin.zip
          rm -rf "$HOME/gradle"
          mkdir -p "$HOME/gradle"
          unzip -q gradle.zip -d "$HOME/gradle"

      - name: Build debug APK
        run: |
          rm -rf project
          mkdir project
          unzip -q ScreenStudySolver-FRESH.zip -d project
          cd project/ScreenStudySolver
          "$HOME/gradle/gradle-9.6/bin/gradle" assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: screen-study-solver-debug-apk
          path: project/ScreenStudySolver/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
